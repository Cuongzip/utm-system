databaseChangeLog:
  - changeSet:
      id: 01-create-simulation-tables
      author: cuong
      changes:
        - createTable:
            tableName: simulation_session
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: drone_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: mission_id
                  type: VARCHAR(50)
              - column:
                  name: departure_hub_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: arrival_hub_id
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: RUNNING
                  constraints:
                    nullable: false
              - column:
                  name: speed
                  type: NUMERIC(8,2)
                  defaultValueNumeric: 15.00
              - column:
                  name: time_scale
                  type: NUMERIC(6,2)
                  defaultValueNumeric: 1.00
              - column:
                  name: current_lat
                  type: NUMERIC(10,7)
              - column:
                  name: current_lon
                  type: NUMERIC(10,7)
              - column:
                  name: current_alt
                  type: NUMERIC(8,2)
              - column:
                  name: current_heading
                  type: NUMERIC(6,2)
              - column:
                  name: current_battery
                  type: NUMERIC(5,2)
              - column:
                  name: progress
                  type: NUMERIC(5,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: total_distance
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: traveled_distance
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 0.00
              - column:
                  name: current_segment
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: total_waypoints
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: waypoints_json
                  type: TEXT
              - column:
                  name: active_scenario
                  type: VARCHAR(50)
              - column:
                  name: created_on
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: last_modified_on
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_modified_by
                  type: VARCHAR(255)

        - createIndex:
            indexName: idx_sim_session_drone
            tableName: simulation_session
            columns:
              - column:
                  name: drone_id

        - createIndex:
            indexName: idx_sim_session_status
            tableName: simulation_session
            columns:
              - column:
                  name: status

        - createTable:
            tableName: simulation_event
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: scenario
                  type: VARCHAR(50)
              - column:
                  name: message
                  type: TEXT
              - column:
                  name: severity
                  type: VARCHAR(20)
              - column:
                  name: config_json
                  type: TEXT
              - column:
                  name: created_on
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by
                  type: VARCHAR(255)

        - createIndex:
            indexName: idx_sim_event_session
            tableName: simulation_event
            columns:
              - column:
                  name: session_id
