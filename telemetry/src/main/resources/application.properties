server.port=${SERVER_PORT:8089}
server.servlet.context-path=/telemetry
server.forward-headers-strategy=framework

spring.application.name=telemetry
spring.threads.virtual.enabled=true
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:54320}/${POSTGRES_DB:utm_telemetry}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Spring Security OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity}/realms/${KEYCLOAK_REALM:UTM}

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.utm.telemetry

cors.allowed-origins=*
# OpenAPI / Swagger UI OAuth2
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.client-id=swagger-ui
springdoc.oauthflow.authorization-url=${KEYCLOAK_AUTH_URL:http://localhost:8080/realms/UTM/protocol/openid-connect/auth}
springdoc.oauthflow.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/UTM/protocol/openid-connect/token}
