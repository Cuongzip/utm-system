databaseChangeLog:
  - changeSet:
      id: 02-standardize-telemetry-schema
      author: utm-architecture
      changes:
        - sql:
            splitStatements: false
            sql: |
              UPDATE telemetry_record SET created_on = CURRENT_TIMESTAMP WHERE created_on IS NULL;
              UPDATE telemetry_record SET flight_id = NULL WHERE flight_id IS NOT NULL AND TRIM(flight_id) = '';
              UPDATE telemetry_record SET created_by = LEFT(created_by, 100) WHERE LENGTH(created_by) > 100;
              UPDATE telemetry_record SET last_modified_by = LEFT(last_modified_by, 100) WHERE LENGTH(last_modified_by) > 100;

              ALTER TABLE telemetry_record ALTER COLUMN latitude TYPE DOUBLE PRECISION USING latitude::DOUBLE PRECISION;
              ALTER TABLE telemetry_record ALTER COLUMN longitude TYPE DOUBLE PRECISION USING longitude::DOUBLE PRECISION;
              ALTER TABLE telemetry_record ALTER COLUMN altitude TYPE DOUBLE PRECISION USING altitude::DOUBLE PRECISION;
              ALTER TABLE telemetry_record ALTER COLUMN speed TYPE DOUBLE PRECISION USING speed::DOUBLE PRECISION;
              ALTER TABLE telemetry_record ALTER COLUMN heading TYPE DOUBLE PRECISION USING heading::DOUBLE PRECISION;
              ALTER TABLE telemetry_record ALTER COLUMN pitch TYPE DOUBLE PRECISION USING pitch::DOUBLE PRECISION;
              ALTER TABLE telemetry_record ALTER COLUMN roll TYPE DOUBLE PRECISION USING roll::DOUBLE PRECISION;
              ALTER TABLE telemetry_record ALTER COLUMN yaw TYPE DOUBLE PRECISION USING yaw::DOUBLE PRECISION;
              ALTER TABLE telemetry_record ALTER COLUMN battery_percentage TYPE DOUBLE PRECISION USING battery_percentage::DOUBLE PRECISION;

              ALTER TABLE telemetry_record ADD COLUMN IF NOT EXISTS recorded_at TIMESTAMP WITH TIME ZONE;
              UPDATE telemetry_record SET recorded_at = COALESCE(created_on, CURRENT_TIMESTAMP) WHERE recorded_at IS NULL;
              ALTER TABLE telemetry_record ALTER COLUMN recorded_at SET NOT NULL;
              ALTER TABLE telemetry_record ALTER COLUMN recorded_at SET DEFAULT CURRENT_TIMESTAMP;

              ALTER TABLE telemetry_record ALTER COLUMN created_on SET NOT NULL;
              ALTER TABLE telemetry_record ALTER COLUMN created_on SET DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE telemetry_record ALTER COLUMN created_by TYPE VARCHAR(100);
              ALTER TABLE telemetry_record ALTER COLUMN last_modified_by TYPE VARCHAR(100);

              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'chk_telemetry_coordinates') THEN
                  ALTER TABLE telemetry_record ADD CONSTRAINT chk_telemetry_coordinates
                    CHECK (latitude >= -90 AND latitude <= 90 AND longitude >= -180 AND longitude <= 180);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'chk_telemetry_battery_range') THEN
                  ALTER TABLE telemetry_record ADD CONSTRAINT chk_telemetry_battery_range
                    CHECK (battery_percentage IS NULL OR (battery_percentage >= 0 AND battery_percentage <= 100));
                END IF;
              END $$;

              CREATE INDEX IF NOT EXISTS idx_telemetry_created_on ON telemetry_record (created_on DESC);
              CREATE INDEX IF NOT EXISTS idx_telemetry_drone_recorded ON telemetry_record (drone_id, recorded_at DESC);
              CREATE INDEX IF NOT EXISTS idx_telemetry_flight_recorded ON telemetry_record (flight_id, recorded_at DESC);
