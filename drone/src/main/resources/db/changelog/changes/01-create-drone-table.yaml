databaseChangeLog:
  - changeSet:
      id: 01-create-drone-table
      author: cuong
      changes:
        - createTable:
            tableName: drone
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: registration_number
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: manufacturer
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: varchar(36)
              - column:
                  name: home_hub_id
                  type: varchar(36)
              - column:
                  name: battery_capacity_wh
                  type: numeric(8, 2)
                  constraints:
                    nullable: false
              - column:
                  name: max_payload
                  type: numeric(8, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: "AVAILABLE"
                  constraints:
                    nullable: false
              - column:
                  name: created_on
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: varchar(100)
              - column:
                  name: last_modified_on
                  type: timestamp with time zone
              - column:
                  name: last_modified_by
                  type: varchar(100)
        - createIndex:
            indexName: idx_drone_status
            tableName: drone
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_drone_owner_id
            tableName: drone
            columns:
              - column:
                  name: owner_id
        - createIndex:
            indexName: idx_drone_home_hub_id
            tableName: drone
            columns:
              - column:
                  name: home_hub_id
