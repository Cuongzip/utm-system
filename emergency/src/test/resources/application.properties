server.port=8096
server.servlet.context-path=/emergency

spring.application.name=emergency
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:emergency_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/UTM

utm.services.flight=http://localhost:8086
utm.services.drone=http://localhost:8085
utm.services.hub=http://localhost:8084
utm.services.alert=http://localhost:8093