server.port=${SERVER_PORT:8097}
server.servlet.context-path=/weather-ais
server.forward-headers-strategy=framework

spring.application.name=weather-ais
spring.threads.virtual.enabled=true
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Spring Security OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity}/realms/${KEYCLOAK_REALM:UTM}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.utm.weatherais

# Inter-service URLs
utm.services.hub=${HUB_SERVICE_URL:http://hub:8084}

# Aviation Weather, ADS-B, NOTAM, OpenAIP & WMS Configuration (Vietnam Defaults)
utm.weather.default-icaos=${UTM_AVIATION_ICAOS:VVTS,VVNB,VVDN,VVCR,VVPQ,VVCI,VVPB,VVCT}
utm.weather.firs=${UTM_AVIATION_FIRS:VVHM,VVGL}
utm.weather.awc-base-url=${UTM_AWC_BASE_URL:https://aviationweather.gov}
utm.weather.open-meteo-base-url=${UTM_OPEN_METEO_BASE_URL:https://api.open-meteo.com}

utm.adsb.base-url=${UTM_ADSB_BASE_URL:https://api.adsb.lol}
utm.adsb.centers=${UTM_ADSB_CENTERS:10.8188,106.6519,250;21.2212,105.8072,250}
utm.adsb.ttl-ms=${UTM_ADSB_TTL_MS:3000}

utm.notam.base-url=${AUTOROUTER_BASE_URL:https://api.autorouter.aero}
utm.notam.client-id=${AUTOROUTER_CLIENT_ID:}
utm.notam.client-secret=${AUTOROUTER_CLIENT_SECRET:}
utm.notam.default-icaos=${UTM_NOTAM_ICAOS:VVHM,VVGL,VVTS,VVNB,VVDN}

utm.openaip.api-base-url=${OPENAIP_API_BASE_URL:https://api.core.openaip.net}
utm.openaip.tile-base-url=${OPENAIP_TILE_BASE_URL:https://api.tiles.openaip.net}
utm.openaip.api-key=${OPENAIP_API_KEY:}
utm.openaip.country=${OPENAIP_COUNTRY:VN}

utm.dagr.wms-url=${UTM_WMS_URL:}
utm.dagr.layer=${UTM_WMS_LAYER:utm:drone_zones}

cors.allowed-origins=*
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.client-id=swagger-ui
springdoc.oauthflow.authorization-url=${KEYCLOAK_AUTH_URL:http://localhost:8080/realms/UTM/protocol/openid-connect/auth}
springdoc.oauthflow.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/UTM/protocol/openid-connect/token}
