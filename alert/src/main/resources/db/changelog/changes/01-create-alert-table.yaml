databaseChangeLog:
  - changeSet:
      id: 01-create-alert-table
      author: drops-utm
      changes:
        - createTable:
            tableName: alert
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: alert_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: severity
                  type: varchar(20)
                  defaultValue: "HIGH"
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
              - column:
                  name: drone_id
                  type: varchar(36)
              - column:
                  name: flight_id
                  type: varchar(36)
              - column:
                  name: hub_id
                  type: varchar(36)
              - column:
                  name: message
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: details_json
                  type: text
              - column:
                  name: acknowledged
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: acknowledged_at
                  type: timestamp with time zone
              - column:
                  name: acknowledged_by
                  type: varchar(100)
              - column:
                  name: resolved
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: resolved_at
                  type: timestamp with time zone
              - column:
                  name: resolved_by
                  type: varchar(100)
              - column:
                  name: resolution_notes
                  type: text
              - column:
                  name: created_on
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: varchar(100)
              - column:
                  name: last_modified_on
                  type: timestamp with time zone
              - column:
                  name: last_modified_by
                  type: varchar(100)
        - createIndex:
            tableName: alert
            indexName: idx_alert_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: alert
            indexName: idx_alert_severity
            columns:
              - column:
                  name: severity
        - createIndex:
            tableName: alert
            indexName: idx_alert_type
            columns:
              - column:
                  name: alert_type
        - createIndex:
            tableName: alert
            indexName: idx_alert_flight_id
            columns:
              - column:
                  name: flight_id
        - createIndex:
            tableName: alert
            indexName: idx_alert_drone_id
            columns:
              - column:
                  name: drone_id
        - createIndex:
            tableName: alert
            indexName: idx_alert_resolved
            columns:
              - column:
                  name: resolved
        - createIndex:
            tableName: alert
            indexName: idx_alert_created_on
            columns:
              - column:
                  name: created_on
