services:
  nginx:
    image: nginx:1.27.2
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/configuration/custom_proxy_settings.conf:/etc/nginx/conf.d/custom_proxy_settings.conf
    ports:
      - "${NGINX_PORT:-8081}:80"
    depends_on:
      - organization
      - drone
      - hub
      - flight
      - airspace
      - telemetry
      - simulation
      - conflict
      - alert
      - connectivity
      - mission
      - emergency
      - backoffice-bff
      - identity
    networks:
      - utm-network

  backoffice-bff:
    build:
      context: .
      dockerfile: ./backoffice-bff/Dockerfile
    image: backoffice-bff:latest
    ports:
      - "8082:8082"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8082
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - KEYCLOAK_AUTH_URL=http://localhost:8080/realms/UTM/protocol/openid-connect/auth
      - KEYCLOAK_TOKEN_URL=http://identity/realms/UTM/protocol/openid-connect/token
      - KEYCLOAK_JWKS_URL=http://identity/realms/UTM/protocol/openid-connect/certs
      - KEYCLOAK_USERINFO_URL=http://identity/realms/UTM/protocol/openid-connect/userinfo
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_GATEWAY_URL=http://nginx
      - BACKOFFICE_UI_URL=http://backoffice:3000
    depends_on:
      - identity
      - redis
    networks:
      - utm-network

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    image: backoffice:latest
    mem_limit: 384m
    ports:
      - "${BACKOFFICE_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - API_GATEWAY_URL=http://nginx
    networks:
      - utm-network

  organization:
    build:
      context: .
      dockerfile: ./organization/Dockerfile
    image: organization:latest
    ports:
      - "8083:8083"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8083
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_organization
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - utm-network

  drone:
    build:
      context: .
      dockerfile: ./drone/Dockerfile
    image: drone:latest
    ports:
      - "8085:8085"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8085
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_drone
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - HUB_SERVICE_URL=http://hub:8084
      - ORGANIZATION_SERVICE_URL=http://organization:8083
      - CONNECTIVITY_SERVICE_URL=http://connectivity:8094
    depends_on:
      postgres:
        condition: service_healthy
      hub:
        condition: service_started
    networks:
      - utm-network

  hub:
    build:
      context: .
      dockerfile: ./hub/Dockerfile
    image: hub:latest
    ports:
      - "8084:8084"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8084
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_hub
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - utm-network

  flight:
    build:
      context: .
      dockerfile: ./flight/Dockerfile
    image: flight:latest
    ports:
      - "8086:8086"
    mem_limit: 384m
    environment:
      - SERVER_PORT=8086
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx192m -XX:MaxMetaspaceSize=140m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_flight
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - DRONE_SERVICE_URL=http://drone:8085
      - HUB_SERVICE_URL=http://hub:8084
      - AIRSPACE_SERVICE_URL=http://airspace:8087
      - TELEMETRY_SERVICE_URL=http://telemetry:8089
      - ALERT_SERVICE_URL=http://alert:8093
      - CONFLICT_SERVICE_URL=http://conflict:8092
      - EMERGENCY_SERVICE_URL=http://emergency:8096
      - UTM_SYSTEM_AUTH_PASSWORD=${UTM_SYSTEM_AUTH_PASSWORD:-Admin123@}
    depends_on:
      postgres:
        condition: service_healthy
      drone:
        condition: service_started
      hub:
        condition: service_started
      airspace:
        condition: service_started
      telemetry:
        condition: service_started
      alert:
        condition: service_started
    networks:
      - utm-network

  airspace:
    build:
      context: .
      dockerfile: ./airspace/Dockerfile
    image: airspace:latest
    ports:
      - "8087:8087"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8087
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_airspace
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - HUB_SERVICE_URL=http://hub:8084
    depends_on:
      postgres:
        condition: service_healthy
      hub:
        condition: service_started
    networks:
      - utm-network

  telemetry:
    build:
      context: .
      dockerfile: ./telemetry/Dockerfile
    image: telemetry:latest
    ports:
      - "8089:8089"
    mem_limit: 384m
    environment:
      - SERVER_PORT=8089
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx192m -XX:MaxMetaspaceSize=140m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_telemetry
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - utm-network

  simulation:
    build:
      context: .
      dockerfile: ./simulation/Dockerfile
    image: simulation:latest
    ports:
      - "8090:8090"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8090
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_simulation
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - TELEMETRY_SERVICE_URL=http://telemetry:8089
      - FLIGHT_SERVICE_URL=http://flight:8086
      - CONNECTIVITY_SERVICE_URL=http://connectivity:8094
    depends_on:
      postgres:
        condition: service_healthy
      telemetry:
        condition: service_started
      flight:
        condition: service_started
      connectivity:
        condition: service_started
    networks:
      - utm-network

  conflict:
    build:
      context: .
      dockerfile: ./conflict/Dockerfile
    image: conflict:latest
    ports:
      - "8092:8092"
    mem_limit: 448m
    environment:
      - SERVER_PORT=8092
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_conflict
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - FLIGHT_SERVICE_URL=http://flight:8086
      - CONNECTIVITY_SERVICE_URL=http://connectivity:8094
      - TELEMETRY_SERVICE_URL=http://telemetry:8089
      - DRONE_SERVICE_URL=http://drone:8085
      - HUB_SERVICE_URL=http://hub:8084
      - UTM_SYSTEM_AUTH_PASSWORD=${UTM_SYSTEM_AUTH_PASSWORD:-Admin123@}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      flight:
        condition: service_started
      telemetry:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - utm-network

  alert:
    build:
      context: .
      dockerfile: ./alert/Dockerfile
    image: alert:latest
    ports:
      - "8093:8093"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8093
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_alert
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - utm-network

  connectivity:
    build:
      context: .
      dockerfile: ./connectivity/Dockerfile
    image: connectivity:latest
    ports:
      - "8094:8094"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8094
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_connectivity
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - DRONE_SERVICE_URL=http://drone:8085
    depends_on:
      postgres:
        condition: service_healthy
      drone:
        condition: service_started
    networks:
      - utm-network

  mission:
    build:
      context: .
      dockerfile: ./mission/Dockerfile
    image: mission:latest
    ports:
      - "8095:8095"
    mem_limit: 320m
    environment:
      - SERVER_PORT=8095
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_mission
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - HUB_SERVICE_URL=http://hub:8084
      - AIRSPACE_SERVICE_URL=http://airspace:8087
      - DRONE_SERVICE_URL=http://drone:8085
      - FLIGHT_SERVICE_URL=http://flight:8086
      - CONNECTIVITY_SERVICE_URL=http://connectivity:8094
    depends_on:
      postgres:
        condition: service_healthy
      hub:
        condition: service_started
      drone:
        condition: service_started
      flight:
        condition: service_started
    networks:
      - utm-network

  emergency:
    build:
      context: .
      dockerfile: ./emergency/Dockerfile
    image: emergency:latest
    ports:
      - "8096:8096"
    mem_limit: 352m
    environment:
      - SERVER_PORT=8096
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xms32m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=48m
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=utm_emergency
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - KEYCLOAK_URL=http://identity
      - FLIGHT_SERVICE_URL=http://flight:8086
      - DRONE_SERVICE_URL=http://drone:8085
      - HUB_SERVICE_URL=http://hub:8084
      - ALERT_SERVICE_URL=http://alert:8093
    depends_on:
      postgres:
        condition: service_healthy
      flight:
        condition: service_started
      drone:
        condition: service_started
      hub:
        condition: service_started
      alert:
        condition: service_started
    networks:
      - utm-network

  swagger-ui:
    profiles: ["tools"]
    image: swaggerapi/swagger-ui:v5.17.14
    mem_limit: 128m
    ports:
      - "8088:8080"
    environment:
      - BASE_URL=/swagger-ui
      - "URLS=[{ url: '/organization/v3/api-docs', name: 'Organization Service' }, { url: '/drone/v3/api-docs', name: 'Drone Service' }, { url: '/hub/v3/api-docs', name: 'Hub Service' }, { url: '/flight/v3/api-docs', name: 'Flight Service' }, { url: '/airspace/v3/api-docs', name: 'Airspace Service' }, { url: '/telemetry/v3/api-docs', name: 'Telemetry Service' }, { url: '/simulation/v3/api-docs', name: 'Simulation Service' }, { url: '/conflict/v3/api-docs', name: 'Conflict Detection Service' }, { url: '/alert/v3/api-docs', name: 'Alert Service' }, { url: '/connectivity/v3/api-docs', name: 'Connectivity Service' }, { url: '/mission/v3/api-docs', name: 'Mission Service' }, { url: '/emergency/v3/api-docs', name: 'Emergency Service' }]"
      - OAUTH_CLIENT_ID=swagger-ui
      - OAUTH_USE_PKCE=true
    networks:
      - utm-network

  identity:
    image: quay.io/keycloak/keycloak:26.0.2
    mem_limit: 768m
    command: 'start-dev --import-realm'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      KC_HTTP_PORT: 80
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_APPEND: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=192m"
    ports:
      - "8080:80"
    volumes:
      - ./identity/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./identity/keycloak-theme/dist_keycloak/utm-theme.jar:/opt/keycloak/providers/utm-theme.jar
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - utm-network

  postgres:
    image: postgres:16-alpine
    command: "postgres -c max_connections=150 -c shared_buffers=64MB -c work_mem=2MB"
    mem_limit: 512m
    hostname: ${POSTGRES_HOST:-postgres}
    ports:
      - "${POSTGRES_LOCAL_PORT:-54320}:5432"
    volumes:
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - utm-network

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:8.12
    mem_limit: 256m
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@utm.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - utm-network

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    mem_limit: 512m
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_HEAP_OPTS=-Xms128m -Xmx256m
      - KAFKA_OPTS=-Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_LOG_RETENTION_HOURS=24
      - KAFKA_LOG_RETENTION_BYTES=1073741824
      - KAFKA_LOG_SEGMENT_BYTES=268435456
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - utm-network

  kafka-ui:
    profiles: ["tools"]
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    mem_limit: 384m
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: utm-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xms64m -Xmx256m"
    ports:
      - "8099:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - utm-network

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 96mb --maxmemory-policy volatile-lru
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - utm-network

networks:
  utm-network:
    driver: bridge
    name: utm-network

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  kafka_data:
