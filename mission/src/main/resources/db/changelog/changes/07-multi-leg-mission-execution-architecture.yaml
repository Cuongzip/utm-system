databaseChangeLog:
  - changeSet:
      id: 07-multi-leg-mission-execution-architecture
      author: utm-backend
      changes:
        - addColumn:
            tableName: waypoint
            columns:
              - column:
                  name: hub_id
                  type: VARCHAR(36)
              - column:
                  name: stopover_type
                  type: VARCHAR(30)
                  defaultValue: NONE
                  constraints:
                    nullable: false
              - column:
                  name: ground_time_minutes
                  type: INTEGER
              - column:
                  name: payload_delta_kg
                  type: DOUBLE PRECISION
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: hover_duration_sec
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: speed_mps
                  type: DOUBLE PRECISION
        - addColumn:
            tableName: mission_execution
            columns:
              - column:
                  name: execution_mode
                  type: VARCHAR(30)
                  defaultValue: SAME_DRONE_SEQUENTIAL
                  constraints:
                    nullable: false
              - column:
                  name: primary_drone_id
                  type: VARCHAR(36)
              - column:
                  name: current_leg_index
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_legs
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: completed_legs
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: paused_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: abort_reason
                  type: TEXT
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: trigger_type
                  type: VARCHAR(30)
                  defaultValue: MANUAL
                  constraints:
                    nullable: false
        - createTable:
            tableName: mission_execution_leg
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: execution_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_mission_exec_leg_execution
                    references: mission_execution(id)
                    deleteCascade: true
              - column:
                  name: mission_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: leg_index
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: flight_id
                  type: VARCHAR(36)
              - column:
                  name: flight_number
                  type: VARCHAR(100)
              - column:
                  name: drone_id
                  type: VARCHAR(36)
              - column:
                  name: departure_hub_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: arrival_hub_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: stopover_type
                  type: VARCHAR(30)
                  defaultValue: NONE
                  constraints:
                    nullable: false
              - column:
                  name: ground_time_minutes
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: distance_meters
                  type: DOUBLE PRECISION
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: payload_weight_kg
                  type: DOUBLE PRECISION
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: estimated_energy_wh
                  type: DOUBLE PRECISION
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_departure
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: scheduled_arrival
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: actual_departure
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: actual_arrival
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: depends_on_flight_id
                  type: VARCHAR(36)
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PLANNED
                  constraints:
                    nullable: false
              - column:
                  name: created_on
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: last_modified_on
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_modified_by
                  type: VARCHAR(255)
        - createIndex:
            tableName: mission_execution_leg
            indexName: idx_mission_exec_leg_exec
            columns:
              - column:
                  name: execution_id
              - column:
                  name: leg_index
        - createIndex:
            tableName: mission_execution_leg
            indexName: idx_mission_exec_leg_flight
            columns:
              - column:
                  name: flight_id
      rollback:
        - dropIndex:
            tableName: mission_execution_leg
            indexName: idx_mission_exec_leg_flight
        - dropIndex:
            tableName: mission_execution_leg
            indexName: idx_mission_exec_leg_exec
        - dropTable:
            tableName: mission_execution_leg
        - dropColumn:
            tableName: mission_execution
            columnName: trigger_type
        - dropColumn:
            tableName: mission_execution
            columnName: error_message
        - dropColumn:
            tableName: mission_execution
            columnName: abort_reason
        - dropColumn:
            tableName: mission_execution
            columnName: paused_at
        - dropColumn:
            tableName: mission_execution
            columnName: completed_legs
        - dropColumn:
            tableName: mission_execution
            columnName: total_legs
        - dropColumn:
            tableName: mission_execution
            columnName: current_leg_index
        - dropColumn:
            tableName: mission_execution
            columnName: primary_drone_id
        - dropColumn:
            tableName: mission_execution
            columnName: execution_mode
        - dropColumn:
            tableName: waypoint
            columnName: speed_mps
        - dropColumn:
            tableName: waypoint
            columnName: hover_duration_sec
        - dropColumn:
            tableName: waypoint
            columnName: payload_delta_kg
        - dropColumn:
            tableName: waypoint
            columnName: ground_time_minutes
        - dropColumn:
            tableName: waypoint
            columnName: stopover_type
        - dropColumn:
            tableName: waypoint
            columnName: hub_id
