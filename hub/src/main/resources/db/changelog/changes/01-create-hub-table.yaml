databaseChangeLog:
  - changeSet:
      id: 01-create-hub-table
      author: cuong
      changes:
        - createTable:
            tableName: hub
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: latitude
                  type: numeric(10, 7)
                  constraints:
                    nullable: false
              - column:
                  name: longitude
                  type: numeric(10, 7)
                  constraints:
                    nullable: false
              - column:
                  name: altitude_msl
                  type: numeric(8, 2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: airspace_radius
                  type: numeric(8, 2)
                  defaultValueNumeric: 1000.0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
              - column:
                  name: created_on
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: varchar(100)
              - column:
                  name: last_modified_on
                  type: timestamp with time zone
              - column:
                  name: last_modified_by
                  type: varchar(100)
        - createIndex:
            indexName: idx_hub_status
            tableName: hub
            columns:
              - column:
                  name: status
