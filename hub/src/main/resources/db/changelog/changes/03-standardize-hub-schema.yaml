databaseChangeLog:
  - changeSet:
      id: 03-standardize-hub-schema
      author: utm-system
      changes:
        - sql:
            sql: |
              UPDATE hub SET status = UPPER(status) WHERE status IS NOT NULL AND status <> UPPER(status);
              UPDATE hub SET created_on = CURRENT_TIMESTAMP WHERE created_on IS NULL;
              ALTER TABLE hub ALTER COLUMN latitude TYPE DOUBLE PRECISION;
              ALTER TABLE hub ALTER COLUMN longitude TYPE DOUBLE PRECISION;
              ALTER TABLE hub ALTER COLUMN altitude_msl TYPE DOUBLE PRECISION;
              ALTER TABLE hub ALTER COLUMN airspace_radius TYPE DOUBLE PRECISION;
              ALTER TABLE hub ALTER COLUMN created_on SET DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE hub ALTER COLUMN created_on SET NOT NULL;
              ALTER TABLE hub DROP CONSTRAINT IF EXISTS chk_hub_latitude;
              ALTER TABLE hub ADD CONSTRAINT chk_hub_latitude CHECK (latitude >= -90.0 AND latitude <= 90.0);
              ALTER TABLE hub DROP CONSTRAINT IF EXISTS chk_hub_longitude;
              ALTER TABLE hub ADD CONSTRAINT chk_hub_longitude CHECK (longitude >= -180.0 AND longitude <= 180.0);
              ALTER TABLE hub DROP CONSTRAINT IF EXISTS chk_hub_airspace_radius;
              ALTER TABLE hub ADD CONSTRAINT chk_hub_airspace_radius CHECK (airspace_radius > 0.0);
              ALTER TABLE hub DROP CONSTRAINT IF EXISTS chk_hub_max_drones;
              ALTER TABLE hub ADD CONSTRAINT chk_hub_max_drones CHECK (max_simultaneous_drones > 0);
              ALTER TABLE hub DROP CONSTRAINT IF EXISTS chk_hub_airspace_bounds;
              ALTER TABLE hub ADD CONSTRAINT chk_hub_airspace_bounds CHECK (airspace_floor < airspace_ceiling);
              ALTER TABLE hub DROP CONSTRAINT IF EXISTS chk_hub_status;
              ALTER TABLE hub ADD CONSTRAINT chk_hub_status CHECK (status IN ('ACTIVE', 'INACTIVE', 'MAINTENANCE'));
