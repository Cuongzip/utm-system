databaseChangeLog:
  - changeSet:
      id: 01-create-airspace-zone-table
      author: drops-utm
      changes:
        - createTable:
            tableName: airspace_zone
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: floor_altitude_m
                  type: double precision
                  constraints:
                    nullable: false
              - column:
                  name: ceiling_altitude_m
                  type: double precision
                  constraints:
                    nullable: false
              - column:
                  name: geometry
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: hub_id
                  type: varchar(36)
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: created_on
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: varchar(100)
              - column:
                  name: last_modified_on
                  type: timestamp with time zone
              - column:
                  name: last_modified_by
                  type: varchar(100)
        - createIndex:
            tableName: airspace_zone
            indexName: idx_airspace_zone_type
            columns:
              - column:
                  name: type
        - createIndex:
            tableName: airspace_zone
            indexName: idx_airspace_zone_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: airspace_zone
            indexName: idx_airspace_zone_hub_id
            columns:
              - column:
                  name: hub_id
