server.port=${SERVER_PORT:8092}
server.servlet.context-path=/conflict
server.forward-headers-strategy=framework

spring.application.name=conflict
spring.threads.virtual.enabled=true
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:54320}/${POSTGRES_DB:utm_conflict}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Spring Security OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity}/realms/${KEYCLOAK_REALM:UTM}

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.utm.conflict

# Inter-service URLs
utm.services.flight=${FLIGHT_SERVICE_URL:http://flight:8086}
utm.services.telemetry=${TELEMETRY_SERVICE_URL:http://telemetry:8089}
utm.services.drone=${DRONE_SERVICE_URL:http://drone:8085}
utm.services.hub=${HUB_SERVICE_URL:http://hub:8084}
utm.services.airspace=${AIRSPACE_SERVICE_URL:http://airspace:8087}
utm.services.alert=${ALERT_SERVICE_URL:http://alert:8093}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
utm.kafka.topic.telemetry-ingest=${UTM_KAFKA_TOPIC_TELEMETRY:utm.telemetry.ingest}
utm.kafka.topic.conflict-alerts=${UTM_KAFKA_TOPIC_CONFLICT_ALERTS:utm.conflict.alerts}

# Conflict Detection Threshold Configuration
utm.conflict.threshold.horizontal-m=${CONFLICT_HORIZ_THRESHOLD_M:150.0}
utm.conflict.threshold.vertical-m=${CONFLICT_VERT_THRESHOLD_M:30.0}
utm.conflict.threshold.critical-horizontal-m=${CONFLICT_CRITICAL_HORIZ_M:50.0}
utm.conflict.threshold.critical-vertical-m=${CONFLICT_CRITICAL_VERT_M:15.0}

cors.allowed-origins=*
# OpenAPI / Swagger UI OAuth2
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.client-id=swagger-ui
springdoc.oauthflow.authorization-url=${KEYCLOAK_AUTH_URL:http://localhost:8080/realms/UTM/protocol/openid-connect/auth}
springdoc.oauthflow.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/UTM/protocol/openid-connect/token}
