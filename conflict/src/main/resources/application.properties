server.port=${SERVER_PORT:8092}
server.servlet.context-path=/conflict
server.forward-headers-strategy=framework

spring.application.name=conflict
spring.threads.virtual.enabled=true
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:54320}/${POSTGRES_DB:utm_conflict}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Spring Security OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://identity}/realms/${KEYCLOAK_REALM:UTM}

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.utm.conflict

# Inter-service URLs
utm.services.flight=${FLIGHT_SERVICE_URL:http://flight:8086}
utm.services.telemetry=${TELEMETRY_SERVICE_URL:http://telemetry:8089}
utm.services.drone=${DRONE_SERVICE_URL:http://drone:8085}
utm.services.hub=${HUB_SERVICE_URL:http://hub:8084}

# Conflict Detection Watchdog Configuration
utm.conflict.watchdog.enabled=${CONFLICT_WATCHDOG_ENABLED:true}
utm.conflict.watchdog.interval-ms=${CONFLICT_WATCHDOG_INTERVAL_MS:5000}
utm.conflict.threshold.horizontal-m=${CONFLICT_HORIZ_THRESHOLD_M:150.0}
utm.conflict.threshold.vertical-m=${CONFLICT_VERT_THRESHOLD_M:30.0}
utm.conflict.threshold.critical-horizontal-m=${CONFLICT_CRITICAL_HORIZ_M:50.0}
utm.conflict.threshold.critical-vertical-m=${CONFLICT_CRITICAL_VERT_M:15.0}

cors.allowed-origins=*
